[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "corp-llm-gateway"
version = "1.1.0"
description = "Corporate LLM gateway with sanitization guardrail (LiteLLM-based)"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Artem Likhomanenko", email = "a.likhomanenko@gmail.com" }]
dependencies = [
    # Exact, not a range: the route gate is generated from ONE litellm's route
    # source and guarded against it (tests/route_gate/). A range would let CI
    # resolve a different proxy than the image pins, so the guard would pass
    # against routes the gateway never serves. Seventh pin site — move it with
    # the other six (tests/test_litellm_pin.py) and re-run the collector.
    "litellm==1.101.0",
    "redis>=5.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "structlog>=24.1",
]

[project.scripts]
gateway-admin = "corp_llm_gateway.cli.admin:main"
corp-llm-gateway = "corp_llm_gateway.cli.status:main"
corp-llm-gateway-proxy = "corp_llm_gateway.cli.proxy:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "fakeredis>=2.23",
    "PyYAML>=6.0",
    "ruff==0.15.14",
    "pre-commit>=3.7",
    "corp-llm-gateway[asgi,metrics]",
]
# What `python -m corp_llm_gateway.serve` needs to serve litellm's ASGI app.
# `litellm[proxy]` is the whole set: `litellm.proxy.proxy_server` imports
# websockets, orjson, apscheduler, mcp and a dozen more at module level, so
# fastapi + uvicorn alone cannot import the app. The gateway image needs none
# of this (its base IS the litellm proxy image); the extra exists so CI and
# .venv-bench can RUN tests/test_asgi_entrypoint.py instead of skipping it —
# a skipped startup-invariant test is not a passed gate.
# fastapi/uvicorn are named explicitly because asgi.py and serve.py import them
# directly; the floors are the ones litellm 1.101.0's own `proxy` extra sets.
asgi = [
    "litellm[proxy]==1.101.0",
    "fastapi>=0.136,<1",
    "uvicorn>=0.33,<1",
]
# Postgres token store backend. Keeps the default install lean.
postgres = ["asyncpg>=0.29"]
# JWT verification for RBAC enforcement (gateway-admin operator claims).
# [crypto] pulls `cryptography` — required: RBAC is pinned to RS256 (F11).
oidc = ["pyjwt[crypto]>=2.8"]
# Prometheus metrics exporter (serves /metrics). Optional — default exporter is
# noop, so the base install stays lean and emits nothing.
metrics = ["prometheus-client>=0.20"]
# CPU-only NER stack (torch-free). Install natasha + slovnet from PyPI.
# en_core_web_md is NOT on PyPI by package name — install via its wheel URL:
#   pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl
# or in uv: uv pip install <same URL> (uv lacks `python -m spacy download` pip access).
# pymorphy3 is the gazetteer's RU lemmatizer (rules/gazetteer.py, lazy import);
# without it the gazetteer falls back to surface matching and misses inflections.
ner = [
    "natasha>=1.6",
    "slovnet>=0.6",
    "spacy>=3.8,<3.9",
    "pymorphy3>=2.0",
    "pymorphy3-dicts-ru>=2.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/corp_llm_gateway"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "requires_litellm: skip when litellm is not installed",
    "requires_ner: skip when natasha or spacy cannot be imported",
    "requires_helm: skip when the helm binary is not on PATH",
    "requires_shellcheck: skip when shellcheck is not on PATH",
    "not_root: skip when running as root",
    "slow: tests over 2 s; deselect with -m \"not slow\"; CI runs everything",
]
