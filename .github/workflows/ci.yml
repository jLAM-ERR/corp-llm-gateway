name: ci

# Gates every PR on the real suite: ruff (lint job) + the full pytest suite on
# Python 3.14 with the ner/postgres/oidc/asgi/metrics extras (test job), run once
# through the test-suite gates in the pinned full environment — the authoritative
# run CLAUDE.md refers to, including NER, RS256/RBAC crypto, the Postgres contract
# tests and the helm render tests. The minimal environment is a local check
# (docs/testing/must-keep.md). tests/e2e runs in its own job (e2e) against real
# Redis and the two mocks. Every job runs 3.14, the interpreter .venv-bench runs;
# pyproject still declares a lower floor, which CI no longer exercises.

on:
  pull_request:
  push:
    branches: ["release/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      # ruff pin mirrors the [dev] extra in pyproject.toml and .pre-commit-config.yaml
      # (0.15.14) — deliberate duplication so this job stays a fast, standalone install.
      - run: pip install ruff==0.15.14
      - run: ruff check src tests && ruff format --check src tests

  test:
    runs-on: ubuntu-latest
    # 1.2 GB litellm image pull for tests/integration/test_anthropic_oauth_outbound.py
    # on top of the unit suite, which runs once, under the test-suite gates.
    timeout-minutes: 60
    # The Postgres store contract tests (incl. the issuance race tests) run against
    # this service. GitHub sets CI=true, which turns their "Postgres unreachable"
    # skip into a failure (tests/postgres_support.py); the credentials mirror the
    # demo stack's gateway/gateway/gateway, pinned by test_token_store_contract.py.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
          POSTGRES_DB: gateway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # Full history: the must-keep gate rebuilds its step-1 rule from the
      # e9e877f..807831a diff (tests/_gates/must_keep.py); a depth-1 clone lacks both.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The interpreter scripts/test-env.sh builds the venv from; the venv's pip
      # shares this job's pip cache, keyed on what the full recipe installs.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            scripts/test-env.full.txt
      # Unconditional: tests/helm render tests are skipif-helm — without this step
      # they'd silently skip instead of gating the chart.
      - uses: azure/setup-helm@v4
      # The test-suite gates (docs/testing/must-keep.md): the venv built from its pinned
      # recipe (every extra + the en_core_web_md wheel), its fingerprint, the static
      # gates, then the whole suite once, checked against the committed outcome ledger.
      # The script sets CI=true and its own env; the var below keeps the skip guard armed
      # in the step itself. CORP_REQUIRE_PROXY_CAPTURE turns the docker/image/reachability
      # skips in tests/integration/test_anthropic_oauth_outbound.py into failures: without
      # it a daemon, registry or network fault produces a green job that verified none of
      # the outbound headers, body, streaming, retention or proxy stdout. Asserted from the
      # suite itself, so a dropped var fails the run.
      - name: Test-suite gates, full environment
        run: scripts/test-env.sh full && scripts/test-gates.sh full
        env:
          CORP_REQUIRE_PROXY_CAPTURE: "1"
          CORP_TEST_PG_DSN: postgresql://gateway:gateway@localhost:5432/gateway

  # The route gate on the real image (tests/integration/test_route_gate_container.py)
  # and the nginx front door in front of it (test_nginx_allowlist_image.py: the
  # warmed route table, the canary through nginx), in parallel with the unit suite.
  # The suites drive the image over HTTP, so the runner's interpreter is not what
  # they test. The image tag carries a digest of its build inputs, so a build step
  # and the suites' own fixture resolve the same tag and never run against an image
  # built from other sources.
  integration-container:
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Build the gateway test image
        run: python -m tests.integration.gateway_image
      # CORP_REQUIRE_PROXY_CAPTURE turns the harness's docker/image skips into
      # failures: a skipped container suite must not report green.
      - run: >-
          PYTHONPATH=src python -m pytest -q -rs
          tests/integration/test_route_gate_container.py
          tests/integration/test_nginx_allowlist_image.py
        env:
          CORP_REQUIRE_PROXY_CAPTURE: "1"

  # tests/e2e against real Redis and the corp-LLM and Langfuse mocks, started from
  # docker/*/app.py, in parallel with the other jobs. docker-compose.yml's e2e
  # service is the local route to the same run. Every e2e test skips without its
  # service env var, so CORP_REQUIRE_E2E (tests/e2e/conftest.py) turns any skip
  # into a failure: a dropped var cannot report green over nothing.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      REDIS_URL: redis://localhost:6379/0
      CORP_LLM_ENDPOINT: http://127.0.0.1:8000
      CORP_LLM_AUTH_PROVIDER: noop
      LANGFUSE_URL: http://127.0.0.1:3000
      LANGFUSE_PUBLIC_KEY: pk-test-ci
      LANGFUSE_SECRET_KEY: sk-test-ci
      RUN_PROXY_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      # [dev] brings pytest and, through asgi, the mocks' fastapi + uvicorn.
      - run: pip install -e ".[dev]"
      - name: Start the corp-LLM and Langfuse mocks
        run: |
          nohup python -m uvicorn --app-dir docker/corp-llm-mock app:app \
            --host 127.0.0.1 --port 8000 > corp-llm-mock.log 2>&1 &
          nohup python -m uvicorn --app-dir docker/langfuse-mock app:app \
            --host 127.0.0.1 --port 3000 > langfuse-mock.log 2>&1 &
          for url in http://127.0.0.1:8000/healthz/live http://127.0.0.1:3000/api/public/health; do
            for _ in $(seq 1 30); do
              curl -fsS "$url" > /dev/null && continue 2
              sleep 1
            done
            echo "::error::mock not healthy after 30 s: $url"
            cat corp-llm-mock.log langfuse-mock.log
            exit 1
          done
      - run: PYTHONPATH=src python -m pytest tests/e2e -q -rs
        env:
          CORP_REQUIRE_E2E: "1"
      - name: Mock logs
        if: failure()
        run: cat corp-llm-mock.log langfuse-mock.log
