name: ci

# Gates every PR on the real suite: ruff (lint job) + the full pytest suite on
# Python 3.14 with the ner/postgres/oidc/asgi/metrics extras (test job) — the
# authoritative run CLAUDE.md refers to, including NER, RS256/RBAC crypto, the
# Postgres contract tests and the helm render tests. Every job runs 3.14, the
# interpreter .venv-bench runs; pyproject still declares a lower floor, which CI
# no longer exercises.

on:
  pull_request:
  push:
    branches: ["release/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      # ruff pin mirrors the [dev] extra in pyproject.toml and .pre-commit-config.yaml
      # (0.15.14) — deliberate duplication so this job stays a fast, standalone install.
      - run: pip install ruff==0.15.14
      - run: ruff check src tests && ruff format --check src tests

  test:
    runs-on: ubuntu-latest
    # 1.2 GB litellm image pull for tests/integration/test_anthropic_oauth_outbound.py
    # on top of the unit suite, then the suite twice more under the refactor gates.
    timeout-minutes: 120
    # The Postgres store contract tests (incl. the issuance race tests) run against
    # this service. GitHub sets CI=true, which turns their "Postgres unreachable"
    # skip into a failure (tests/postgres_support.py); the credentials mirror the
    # demo stack's gateway/gateway/gateway, pinned by test_token_store_contract.py.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
          POSTGRES_DB: gateway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # Full history: the must-keep gate rebuilds its step-1 rule from the
      # e9e877f..807831a diff (tests/_gates/must_keep.py); a depth-1 clone lacks both.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Unconditional: tests/helm render tests are skipif-helm — without this step
      # they'd silently skip instead of gating the chart.
      - uses: azure/setup-helm@v4
      - run: pip install -e ".[dev,ner,postgres,oidc,asgi,metrics]"
      # Model wheel version mirrors Dockerfile.gateway's EN_MODEL_VERSION default
      # and build-image.yml's default (3.8.0) — keep all three in sync.
      - run: pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl
      # CORP_REQUIRE_PROXY_CAPTURE turns the docker/image/reachability skips in
      # tests/integration/test_anthropic_oauth_outbound.py into failures. Without
      # it a daemon, registry or network fault produces a green job that verified
      # none of the outbound headers, body, streaming, retention or proxy stdout.
      # Asserted from the suite itself, so a dropped var fails the run.
      - run: PYTHONPATH=src pytest tests/ -q
        env:
          CORP_REQUIRE_PROXY_CAPTURE: "1"
          CORP_TEST_PG_DSN: postgresql://gateway:gateway@localhost:5432/gateway
      # The test-suite refactor gates (docs/testing/must-keep.md): the suite again in each
      # of the two reproducible environments, each built from its recipe and checked
      # against the committed outcome ledger, coverage and check inventory. The script
      # sets each run's own env (minimal drops CI, full sets it); the var below keeps
      # the skip guard armed for this step like every other one that runs the suite.
      - name: Refactor gates, minimal environment
        run: scripts/test-env.sh minimal && scripts/test-gates.sh minimal
        env:
          CORP_REQUIRE_PROXY_CAPTURE: "1"
      - name: Refactor gates, full environment
        run: scripts/test-env.sh full && scripts/test-gates.sh full
        env:
          CORP_REQUIRE_PROXY_CAPTURE: "1"
          CORP_TEST_PG_DSN: postgresql://gateway:gateway@localhost:5432/gateway

  # The route gate on the real image (tests/integration/test_route_gate_container.py)
  # and the nginx front door in front of it (test_nginx_allowlist_image.py: the
  # warmed route table, the canary through nginx), in parallel with the unit suite.
  # The suites drive the image over HTTP, so the runner's interpreter is not what
  # they test. The image tag carries a digest of its build inputs, so a build step
  # and the suites' own fixture resolve the same tag and never run against an image
  # built from other sources.
  integration-container:
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Build the gateway test image
        run: python -m tests.integration.gateway_image
      # CORP_REQUIRE_PROXY_CAPTURE turns the harness's docker/image skips into
      # failures: a skipped container suite must not report green.
      - run: >-
          PYTHONPATH=src python -m pytest -q -rs
          tests/integration/test_route_gate_container.py
          tests/integration/test_nginx_allowlist_image.py
        env:
          CORP_REQUIRE_PROXY_CAPTURE: "1"
