# Cache B (per-conversation mapping store) durability. AOF so a restart
# doesn't lose in-flight post_call desanitization mappings.
appendonly yes
appendfsync everysec
maxmemory 512mb
# noeviction, NOT allkeys-lru: CLAUDE.md calls Cache B *required* for
# post_call desanitization. An eviction policy would silently drop live
# mappings under memory pressure and make desanitization return placeholder
# text instead of the original content. noeviction instead fails loudly
# (OOM command errors) so the operator notices and resizes, rather than
# degrading correctness silently.
maxmemory-policy noeviction
