# Data-plane litellm config — production, non-k8s hosts. Per-model-prefix
# routing: `claude-*` -> native anthropic/, `gpt-*` -> native openai/, `corp-*`
# -> hosted_vllm/ at the corp vLLM. See compose/README.md "Upstream routing".
#
# BYOK note (verified twice — examples/compose/README.md "BYOK in local mode
# (SPIKE finding)"): native anthropic/ and openai/ providers build their OWN
# upstream credential from the `api_key` below and never read the inbound
# client Authorization header. That header instead carries a LiteLLM virtual
# key, consumed by litellm itself before routing — see "Virtual keys" below.
# BYOK (raw client Authorization forwarded untouched) is retained ONLY on the
# corp-* / hosted_vllm route.
model_list:
  - model_name: "claude-*"
    litellm_params:
      model: "anthropic/claude-*"
      api_key: "os.environ/ANTHROPIC_API_KEY"
  - model_name: "gpt-*"
    litellm_params:
      model: "openai/gpt-*"
      api_key: "os.environ/OPENAI_API_KEY"
  - model_name: "corp-*"
    litellm_params:
      # The corp vLLM exposes a single model; rewrite every corp-* inbound
      # name to it. Keep this literal in sync with CORP_LLM_MODEL in .env
      # (used by the gateway's own oracle client too) if you change it — see
      # helm/corp-llm-gateway/values.yaml corpLlm.model for the k8s twin.
      # CORP_LLM_ENDPOINT is optional (no corp vLLM in every deployment) —
      # left unset, this entry alone fails per-request; it does not fail
      # config load, and the claude-*/gpt-* routes above are unaffected.
      model: "hosted_vllm/GLM-5.1-AWQ"
      api_base: "os.environ/CORP_LLM_ENDPOINT"
      api_key: "os.environ/CORP_LLM_AUTH_TOKEN"
      # Claude Code sends max_tokens=64000 (Opus default); GLM-5.1-AWQ has a
      # 65536-token window, so cap here to leave prompt headroom (matches
      # helm/corp-llm-gateway values.yaml corpLlm.maxTokens).
      max_tokens: 4096
litellm_settings:
  # Reference a module-level INSTANCE (`guardrail`), not the class — litellm's
  # get_instance_fn calls methods on whatever object lives at the path; a
  # class fails ("missing self"). See corp_llm_gateway/bootstrap.py below and
  # helm/corp-llm-gateway/templates/configmap-litellm.yaml.
  callbacks: ["corp_llm_gateway.bootstrap.guardrail"]
  # Claude Code sends modern Anthropic params some upstream models don't
  # accept yet; drop unsupported params rather than 400-ing the request.
  drop_params: true
  # Emit AuditEvent JSON as single-line records (matches the Helm chart; ready
  # for the Vector sidecar A3 wires in).
  json_logs: true
