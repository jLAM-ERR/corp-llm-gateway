# Static — never templated. Everything that depends on .env is rendered by
# entrypoint.sh into /etc/nginx/rendered/ (a tmpfs) and included below. The
# image's /etc/nginx/conf.d/ (and its default.conf server) is never included.

user nginx;
worker_processes auto;

# crit, not warn: at error/warn nginx appends the request line (query string
# included) and the upstream URL to every request-context entry.
error_log /dev/stderr crit;

events {
    worker_connections 1024;
}

http {
    default_type application/octet-stream;
    server_tokens off;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    client_header_timeout 30s;
    client_body_timeout 60s;
    send_timeout 60s;

    # Compression buffers the SSE streams the gateway serves, and compressing
    # secrets next to attacker-chosen text is the BREACH shape.
    gzip off;

    include /etc/nginx/rendered/*.conf;
}
